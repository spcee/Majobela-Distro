<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Majobela | Upload</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #43d16f;
      --dark: #121212;
      --darker: #0a0a0a;
      --gray: #b3b3b3;
      --light: #f0f0f0;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--darker);
      color: var(--light);
      margin: 0;
      padding: 0;
    }
    header {
      padding: 20px;
      background: #1a1a1a;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #333;
    }
    .logo {
      font-weight: 700;
      color: var(--primary);
    }
    nav a {
      color: var(--gray);
      margin-left: 20px;
      text-decoration: none;
    }
    .container {
      padding: 30px;
    }
    .card {
      background: #1a1a1a;
      padding: 20px;
      border-radius: 12px;
      margin: 20px 0;
      border: 1px solid #333;
    }
    .btn {
      background: var(--primary);
      color: black;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }
    input, select, textarea {
      width: 100%;
      padding: 12px;
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 8px;
      color: white;
      margin: 10px 0;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">MAJOBELA</div>
    <nav>
      <a href="dashboard.html">Home</a>
      <a href="upload.html">Upload</a>
      <a href="profile.html">Profile</a>
    </nav>
  </header>

  <div class="container">
    <h1>📤 Upload Track</h1>

    <div class="card">
      <label>Audio File</label>
      <input type="file" accept="audio/*" />

      <label>Track Title</label>
      <input type="text" placeholder="e.g. Midnight Flow" />

      <label>Genre</label>
      <select>
        <option>Afrobeats</option>
        <option>Amapiano</option>
        <option>Afro-Tech</option>
        <option>Hip-Hop</option>
      </select>

      <button class="btn" onclick="aiTag()">🔍 AI Auto-Tag Metadata</button>
      <textarea id="ai-output" placeholder="AI will suggest title, genre, mood, BPM..." readonly></textarea>

      <button class="btn" style="background:black; margin-top:20px;" onclick="alert('Track uploaded! 🎉')">✅ Confirm & Distribute</button>
    </div>
  </div>

  <script>
    function aiTag() {
      document.getElementById("ai-output").value = "AI Suggestion:\n• Title: 'Midnight Flow'\n• Genre: Afro-Tech\n• Mood: Confident, Nighttime\n• BPM: 108\n• Key: F# Minor\n• Platforms: Spotify, TikTok, Apple";
    }
  </script>

</body>
</html>
