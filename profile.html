<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Majobela | Profile</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
      --primary: #43d16f;
      --dark: #121212;
      --darker: #0a0a0a;
      --gray: #b3b3b3;
      --light: #f0f0f0;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--darker);
      color: var(--light);
      margin: 0;
      padding: 0;
    }
    header {
      padding: 20px;
      background: #1a1a1a;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #333;
    }
    .logo {
      font-weight: 700;
      color: var(--primary);
    }
    nav a {
      color: var(--gray);
      margin-left: 20px;
      text-decoration: none;
    }
    .container {
      padding: 30px;
    }
    .profile-card {
      background: #1a1a1a;
      padding: 30px;
      border-radius: 16px;
      text-align: center;
      border: 1px solid #333;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin: 30px 0;
    }
    .stat {
      background: #1a1a1a;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #333;
    }
  </style>
</head>
<body>
<header>
<div class="logo">MAJOBELA</div>
<nav>
<a href="dashboard.html">Home</a>
<a href="upload.html">Upload</a>
<a href="profile.html">Profile</a>
</nav>
</header>
<div class="container">
<div class="profile-card">
<h1>Luna X</h1>
<p>📍 Johannesburg | 🎧 Afro-Tech</p>
<p>“I make music for the midnight drive.”</p>
</div>
<div class="stats">
<div class="stat">
<h3>1.2M</h3>
<p>Streams</p>
</div>
<div class="stat">
<h3>$4,892</h3>
<p>Earnings (75%)</p>
</div>
<div class="stat">
<h3>24K</h3>
<p>Followers</p>
</div>
</div>
</div>
</body>
</html>
